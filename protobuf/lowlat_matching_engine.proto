syntax = "proto3"

package matchingengine;

service MatchingEngine {
    rpc AddLimitOrder(Order) returns (OrderConfirmation) {}
    
    rpc CancelLimitOrder(Order) returns (bool) {}
}

message Order {
    string security = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool limit = 5;
}

message OrderConfirmation {
    optional id = 1;
}

message FillNotification {
    string security = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool partial_fill = 5;
}
