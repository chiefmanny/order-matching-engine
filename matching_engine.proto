syntax = "proto3";

package matchingengine;

service MatchingEngine {
    
    rpc AddLimitOrder(Order) returns (OrderID) {} // Returns an OrderID with id = XXXXXXXX if successful (STATUS::OK), empty if failed (STATUS::___)
    
    rpc CancelLimitOrder(OrderID) returns (OrderID) {} // Returns an OrderID with id = XXXXXXXX if successful (STATUS::OK), empty if failed (STATUS::___)
    
    rpc CheckSymbol(Symbol) returns (SymbolData) {} // Returns SymbolData if successful (STATUS::OK), (STATUS::___) if failed
    
    rpc WatchSymbol(Symbol) returns (stream SymbolData) {} // Streams SymbolData if successful (STATUS::OK), (STATUS::___) if failed
    
    rpc Subscribe(Symbol) returns (stream FillNotification) {} // Streams FillNotifications if successful (STATUS::OK), (STATUS::___) if failed

    rpc GetLevel2(Level2Request) returns (stream Level2Response) {} // Single RPC for both bid and ask snapshots, with depth

}

message Order {
    string symbol = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool limit = 5;
}

message OrderID {
    string symbol = 1;
    optional int32 id = 2;
}

message FillNotification {
    string symbol = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool partial_fill = 5;
    int32 remaining_size = 6;
}

message RejectedAddOrder {
    string reason = 1;
}

message RejectedCancelOrder {
    string reason = 1;
}

message Symbol {
    string symbol = 1;
}

message SymbolData {
    double lastAsk = 1;
    int32 lastAskSize = 2;
    double lastBid = 3;
    int32 lastBidSize = 4;
}

message PriceLevelData {
    double price = 1;
    int32 size = 2;
    int32 rank = 3;
}

message Level2Request {
    string symbol = 1;

    enum Side {
        BID = 0;
        ASK = 1;
        BOTH = 2;
    }

    Side side = 2;       // Request either bid, ask, or both sides of the order book
    int32 depth = 3;     // Specify the depth of the snapshot (e.g., top 10 levels)
}

message Level2Response {
    repeated PriceLevelData bids = 1;   // A list of price levels for bids
    repeated PriceLevelData asks = 2;   // A list of price levels for asks
}