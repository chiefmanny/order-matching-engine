syntax = "proto3";

package matchingengine;

service MatchingEngine {
    
    rpc AddLimitOrder(Order) returns (OrderID) {} // Returns an OrderID with id = XXXXXXXX if successful (STATUS::OK), empty if failed (STATUS::___)
    
    rpc CancelLimitOrder(OrderID) returns (OrderID) {} // Returns an OrderID with id = XXXXXXXX if successful (STATUS::OK), empty if failed (STATUS::___)
    
    rpc CheckSymbol(Symbol) returns (SymbolData) {} // Returns SymbolData if successful (STATUS::OK), (STATUS::___) if failed
    
    rpc WatchSymbol(Symbol) returns (stream SymbolData) {} // Streams SymbolData if successful (STATUS::OK), (STATUS::___) if failed
    
    rpc Subscribe(Symbol) returns (stream FillNotification) {} // Streams FillNotifications if successful (STATUS::OK), (STATUS::___) if failed

    rpc GetAskSnapshot(Symbol) returns (stream PriceLevelData) {} // Streams PriceLevelData with a user-requested depth, and returns (STATUS::OK) if successful, (STATUS::___) if failed
                                                                  // Rank 1 is best ask, 2 is 2nd, 3 is 3rd... etc.  
    rpc GetBidSnapshot(Symbol) returns (stream PriceLevelData) {} // Streams PriceLevelData with a user-requested depth, and returns (STATUS::OK) if successful, (STATUS::___) if failed
                                                                  // Rank 1 is best ask, 2 is 2nd, 3 is 3rd... etc.  
    rpc GetAskAndBidSnapshot(Symbol) returns (stream PriceLevelData) {} // Streams PriceLevelData with a user-requested depth, and returns (STATUS::OK) if successful, (STATUS::___) if failed
                                                                        // Rank 1 is best bid, -1 is best ask, 2 is 2nd best bid, -2 is second best ask... etc.

message Order {
    string symbol = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool limit = 5;
}

message OrderID {
    string symbol = 1;
    optional int32 id = 2;
}

message FillNotification {
    string symbol = 1;
    double price = 2;
    int32 size = 3;
    bool buy = 4;
    bool partial_fill = 5;
    int32 remaining_size = 6;
}

message RejectedAddOrder {
    string reason = 1;
}

message RejectedCancelOrder {
    string reason = 1;
}

message Symbol {
    string symbol = 1;
}

message SymbolData {
    double lastAsk = 1;
    int32 lastAskSize = 2;
    double lastBid = 3;
    int32 lastBidSize = 4;
}

message PriceLevelData {
    double price = 1;
    int32 size = 2;
    int32 rank = 3;
}