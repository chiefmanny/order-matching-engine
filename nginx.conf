server {
    listen 80;

    # Docker Compose DNS resolver — resolves service hostnames at request time
    resolver 127.0.0.11 valid=30s;

    # React SPA — fall back to index.html for client-side routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy — must carry Upgrade headers
    location /ws/ {
        set $upstream http://backend:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # REST API proxy
    location /get-level2-data {
        set $upstream http://backend:8000;
        proxy_pass       $upstream;
        proxy_set_header Host $host;
    }
}
