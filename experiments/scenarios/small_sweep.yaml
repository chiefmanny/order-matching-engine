# Experiment 7 — Small sweep.
#
# The calibrated control market, plus one modest sweep at a known instant.
#
# What it teaches:
#   * Does an aggressive order actually walk the book level by level?
#   * What does a MINOR event look like — the reference point for "too weak"?
#
# 500 shares against a book showing ~500 per level should consume roughly one level
# and be nearly invisible a few seconds later.

extends: baselines/normal_market.yaml
name: small_sweep
description: Calibrated baseline plus a 500-share buy sweep at T+25.
duration_seconds: 45

# A sweep is over in ~100ms — the engine's default BBO cadence — so observe finely
# enough that peak impact is measured from more than a single sample.
engine:
  bbo_interval_ms: 20
recorder:
  l2_interval_ms: 25

participants:
  - id: sweep1
    strategy: sweep
    start_at: 25
    config:
      side: BUY
      targetQuantity: 500
      maxLevels: 3
      settleMs: 400

markers:
  - { at: 25, label: SWEEP 500 }

hypothesis:
  statement: >
    A 500-share buy consumes about one displayed level, produces a small positive
    price impact, and reverts within seconds as the provider replenishes.
  expect:
    - { metric: sweep.levels_consumed,    op: ">=", value: 1 }
    - { metric: sweep.depth_consumed,     op: ">",  value: 0 }
    - { metric: sweep.peak_impact_ticks,  op: ">=", value: 0 }
    - { metric: sweep.peak_impact_ticks,  op: "<=", value: 8 }
